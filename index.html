<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jim+Nightshade&display=swap" rel="stylesheet">
    <title>Landing Page</title>
</head>

<body>
    <div class="form-container">
        <div class="form-left">
            <div class="logo-container">
                <div class="img-container">
                    <img alt="The Odin Project logo" src="assets/odin-logo.png" id="logo-img">
                </div>
                <div class="logo-text jim-nightshade-regular">ODIN</div>
            </div>
            <div class="credits-container">
                <p class="credits-text">Photo by <span class="underline credits-text">Halie West</span> on <span
                        class="underline credits-text">Unsplash</span></p>
            </div>
        </div>
        <div class="form-right">
            <div class="form-top">
                <strong>This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up now to get started.</strong>
                <strong>You <span class="italics">know</span> you want to.</strong>
            </div>
            <div class="form">
                <form class="submission-form">
                    <fieldset class="input-form">
                        <h1>Let's do this!</h1>
                        <legacy class="flex-form">
                            <div class="input-container">
                                <label class="label-text">First Name</label>
                                <input type="text" id="f-name" name="f-name" placeholder="First Name" maxlength="16">
                            </div>
                            <div class="input-container">
                                <label class="label-text">Last Name</label>
                                <input type="text" id="l-name" name="l-name" placeholder="Last Name" maxlength="16">
                            </div>
                            <div class="input-container">
                                <label class="label-text">Email</label>
                                <input type="email" id="email" name="email" placeholder="example@abc.com" required>
                            </div>
                            <div class="input-container">
                                <label class="label-text">Phone Number</label>
                                <input type="tel" id="phone" name="phone" placeholder="01234 567890" required>
                            </div>
                            <div class="input-container">
                                <label class="label-text">Password</label>
                                <input type="password" id="password" name="password" minlength="6" maxlength="20"
                                    required>
                            </div>
                            <div class="input-container">
                                <label class="label-text">Confirm Password</label>
                                <input type="password" id="c-password" name="c-password" minlength="6" maxlength="20"
                                    required>
                            </div>
                        </legacy>
                    </fieldset>
                    <div class="submit-container">
                        <button type="submit">Create Account</button>
                        <p>Already have an account? <span><a>Log in</a></span></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
